name: template-ci

# Runs only on the template itself, so task repos made from it spend no extra Actions minutes.
# Covers the oldest and newest supported Python, and Windows, which tests.yml does not.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    if: github.repository == 'cerredz/vidbyte-memory'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest moved to 26.04, which has no Python 3.9 build; 24.04 keeps the oldest supported Python covered.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q tests
      # The agent plugins in integrations/ ship only from the template, so their tests run only here.
      - run: python -m pytest -q integrations/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test integrations/pi/vidbyte-memory.test.mjs integrations/opencode/test/opencode-plugin.test.mjs bin/vidbyte-memory.test.mjs
        env:
          VIDBYTE_MEMORY_PYTHON: python  # the interpreter setup-python installed pytest into, not `py -3`
      # The npm packages must pack as published: the root one (npx vidbyte-memory, and the Pi package) and OpenCode's.
      - run: npm pack --dry-run
      - run: npm pack --dry-run
        working-directory: integrations/opencode
