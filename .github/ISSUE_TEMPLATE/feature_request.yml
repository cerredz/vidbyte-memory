name: Feature request
description: Propose a change to the template, such as a memory type, a skill, a script or harness support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong or is missing when you run a task repo today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change, and which files it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would open a pull request for this once the design is agreed.
